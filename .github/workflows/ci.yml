name: CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

jobs:
  ascii-guard:
    name: ASCII Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for non-ASCII characters
        run: |
          if grep -rPn '[^\x00-\x7F]' --include="*.py" --include="*.md" --include="*.sh" --include="*.yml" --include="*.yaml" --include="*.toml" --include="*.json" --include="*.jsx" --include="*.js" --include="*.ts" --include="*.tsx" .; then
            echo "ERROR: Non-ASCII characters found. See above for locations."
            exit 1
          fi
          echo "ASCII guard passed."

  internal-data-guard:
    name: Internal Data Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for internal data leaks
        run: |
          TRACKED=$(git ls-files _internal/ | grep -v 'PROJECT_CONTEXT.md' || true)
          if [ -n "$TRACKED" ]; then
            echo "ERROR: Files under _internal/ are tracked (only PROJECT_CONTEXT.md allowed):"
            echo "$TRACKED"
            exit 1
          fi
          echo "Internal data guard passed."

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install linters
        run: pip install ruff==0.8.4 black==24.10.0 gitpython==3.1.43 tree-sitter==0.24.0 tree-sitter-python==0.23.6 tree-sitter-javascript==0.23.1
      - name: Ruff check
        run: ruff check src/ tests/
      - name: Black check
        run: black --check src/ tests/

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch --no-cache-dir
          pip install sentence-transformers==2.2.2 sentencepiece "transformers>=4.35.0" numpy
          pip install pytest==8.3.4 pytest-cov==6.0.0 pytest-asyncio==0.24.0 pytest-timeout==2.3.1 gitpython==3.1.43 tree-sitter==0.24.0 tree-sitter-python==0.23.6 tree-sitter-javascript==0.23.1
      - name: Run unit tests
        env:
          ASYNCIO_DEFAULT_FIXTURE_LOOP_SCOPE: function
        run: pytest tests/unit/ -v --tb=short --timeout=60
